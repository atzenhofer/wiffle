[project]
name = "wiffle"
version = "0.1.0.dev0"
description = "The subwords, word families, formulas and texts of a topic, learned from a few seed phrases"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
parquet = ["pyarrow>=18"]

[project.scripts]
wiffle = "wiffle.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pyarrow>=18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
